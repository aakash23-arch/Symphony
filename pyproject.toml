[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceshield"
version = "0.1.0"
description = "Real-Time Voice Integrity and Impersonation Defense System"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "VoiceShield Engineering Team" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "websockets>=12.0",
    "redis>=5.0.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
    "scikit-learn>=1.3.0",
    "aiosqlite>=0.19.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# speechbrain was the specification's recommendation for E4 (ECAPA-TDNN, C-23)
# but is NOT installable in the verified environment: it requires torchaudio,
# which is absent, and its compatibility with torch 2.1.2 was already flagged
# "REQUIRES VERIFICATION" in EXECUTION_TECH_STACK.md. E4 therefore uses
# transformers' WavLMForXVector (512-d) instead of ECAPA (192-d).
# See docs/MODEL_INVENTORY.md.
ml = [
    "torch>=2.1.0",
    "transformers>=4.30.0",
    "huggingface_hub>=0.20.0",
]
# Fetching the real-speech corpus used by the E4 relative-behaviour test.
ml-fetch = [
    "pyarrow>=14.0.0",
    "soundfile>=0.12.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["backend", "tests"]
asyncio_mode = "auto"
